---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Configure portfolio Nginx site
  ansible.builtin.template:
    src: portfolio.conf.j2
    dest: "/etc/nginx/sites-available/{{ nginx_config_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable portfolio Nginx site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ nginx_config_file }}"
    dest: "/etc/nginx/sites-enabled/{{ nginx_config_file }}"
    state: link
  notify: Reload nginx

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Ensure Nginx is enabled and running
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
